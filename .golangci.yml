version: "2"
linters:
  # Inverted configuration (`default: all` plus `disable`) does not scale well
  # across golangci-lint upgrades, so enable what we want explicitly.
  default: none
  # staticcheck is deliberately not enabled yet: it flags a few hundred
  # pre-existing findings across conv/ and the test suites, which belongs in its
  # own cleanup rather than in the rename.
  enable:
    - errcheck
    - govet
    - unparam
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Test code asserts through gomega rather than returned errors.
      - linters:
          - errcheck
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
