version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - unparam
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - golint
        path: _test\.go
        text: don't use underscores in Go names
      - linters:
          - errcheck
        path: _test\.go
      - path: (.+)\.go$
        text: don't use ALL_CAPS in Go names; use CamelCase
      - path: (.+)\.go$
        text: should not use dot imports
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
